name: aws-assume-role-upgrade
provider: aws

nodeGroup:
  instanceType: t4g.medium
  amiType: AL2023_ARM_64_STANDARD

steps:
  - action: install
    helm:
      chartSource: released
      baseValues: examples/aws-values.yaml
      overrides:
        - '.providerConfig[0].artifactoryUrl = "${ARTIFACTORY_URL}"'
        - '.providerConfig[0].matchImages[0] = "${MATCH_IMAGES}"'
        - '.providerConfig[0].aws.aws_role_name = "${AWS_ROLE_NAME}"'
    verify:
      image: "${TEST_IMAGE}"
      projectedToken: false

  - action: upgrade
    helm:
      baseValues: examples/aws-values.yaml
      overrides:
        - '.providerConfig[0].artifactoryUrl = "${ARTIFACTORY_URL}"'
        - '.providerConfig[0].matchImages[0] = "${MATCH_IMAGES}"'
        - '.providerConfig[0].aws.aws_role_name = "${AWS_ROLE_NAME}"'
        - '.downloadUrl = "${DOWNLOAD_URL}"'
    verify:
      image: "${TEST_IMAGE}"
      projectedToken: false
