name: azure-projected-token
provider: azure

nodeGroup:
  vmSize: Standard_D2pds_v5
  nodeCount: 1
  identityClientId: "${AZURE_NODEPOOL_CLIENT_ID}"

steps:
  - action: install
    helm:
      baseValues: examples/azure-values.yaml
      overrides:
        - '.providerConfig[0].artifactoryUrl = "${ARTIFACTORY_URL}"'
        - '.providerConfig[0].matchImages[0] = "${MATCH_IMAGES}"'
        - '.providerConfig[0].azure.azure_app_client_id = "${AZURE_APP_CLIENT_ID}"'
        - '.providerConfig[0].azure.azure_app_audience = "${AZURE_APP_AUDIENCE}"'
        - '.providerConfig[0].azure.jfrog_oidc_provider_name = "${AZURE_JFROG_PROJECTED_OIDC_PROVIDER_NAME}"'
        - '.providerConfig[0].tokenAttributes.enabled = true'
        - '.rbac.create = true'
        - '.downloadUrl = "${DOWNLOAD_URL}"'
    verify:
      image: "${TEST_IMAGE}"
      projectedToken: true
