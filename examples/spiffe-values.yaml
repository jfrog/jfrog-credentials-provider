# SPIFFE JWT-SVID example values.
#
# SPIFFE is cloud-agnostic: this works on any node that exposes a SPIFFE Workload
# API socket, provided by any SPIFFE implementation (e.g. SPIRE or a vendor — see
# https://spiffe.io). The credential provider fetches a short-lived JWT-SVID for
# spiffe_svid_audience and exchanges it with Artifactory via OIDC.
#
# IMPORTANT: Artifactory validates the JWT-SVID as a "Generic OpenID Connect"
# token, so the SVID's `iss` claim must be an OIDC-discovery-compatible issuer
# (serving /.well-known/openid-configuration + JWKS reachable by Artifactory) and
# must match the issuer configured on the Artifactory OIDC provider. See SPIFFE.md.
providerConfig:
  - name: jfrog-credentials-provider
    artifactoryUrl: <artifactory-url>
    matchImages:
      - "*.<test.your-org.domain.io>"
    defaultCacheDuration: 5h
    spiffe:
      enabled: true
      # Path is implementation-specific; the SPIRE default is shown as an example.
      spiffe_endpoint_socket: "unix:///run/spire/agent-sockets/spire-agent.sock"
      spiffe_svid_audience: "<jwt-svid-audience>"
      jfrog_oidc_provider_name: "<jfrog-oidc-provider-name>"
      # jfrog_token_audience: "*@*"


affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: credentialsProviderEnabled
              operator: In
              values:
                - "true"
